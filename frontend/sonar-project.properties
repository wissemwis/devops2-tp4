# Analyse SonarQube du frontend

# Identifiant unique du projet dans SonarQube
sonar.projectKey=tp4-cours
sonar.projectName=TP4 - Cours DevOps

# Code applicatif à analyser (dossiers séparés par des virgules)
sonar.sources=app,components,lib
# Code des tests
sonar.tests=tests

# Rapport de couverture produit par Vitest (format lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fichiers ignorés par l'analyse
sonar.exclusions=node_modules/**,.next/**,coverage/**,playwright-report/**,test-results/**
# Fichiers exclus du calcul de couverture (voir question Q18)
sonar.coverage.exclusions=app/**,lib/api.ts,components/CoursList.tsx,components/DevOpsLoop.tsx,*.config.*

sonar.sourceEncoding=UTF-8
# Le scanner attend le verdict du Quality Gate et échoue s'il est rouge
sonar.qualitygate.wait=true
